    "value":  "# DietSense: Data-Grounded \u0026 Safety-Aware Conversational AI Agent for Personalized Dietary Assessment and Weight Management\n**期末專題提案報告書（Final Project Proposal）**\n\n- **專題學門**：Domain AI Agent / 智慧營養與健康資訊 (Nutrition Informatics)\n- **核心架構**：AI Agent + Domain Knowledge + Data Analytics + Real-World Application\n- **GitHub 專案 Repository**：https://github.com/hankyyyyyy/DietSense-DIC3-ProjectRefactor\n- **規範對齊**：2020 A-Z SOP (A~Z) / DIC3 Project Proposal Refactor using OpenSpec\n\n---\n\n# DietSense 專案核心架構：A to F 摘要、5 Cores、3 Trade-offs 與 10 Details\n\n---\n\n## 一、A to F 六段式研究摘要（Abstract Story）\n\n### A. Attention Getter（引題與研究動機）\n全球肥胖與過重人口持續攀升，世界衛生組織（WHO, 2024/2025）指出全球已有超過 26 億名成人過重，其中 9.4 億人屬肥胖，相關代謝慢性病佔全球死因之 74%。在臺灣，衛生福利部國民健康署最新調查顯示，18 歲以上成人過重與肥胖比率已高達 47.9%，年健保相關支出逾新台幣 500 億元。研究證實持續進行飲食熱量自我監測（Self-monitoring）可提升減重成功率達 2 倍，然而 SMARTER 臨床試驗等研究指出，高達 85% 的使用者在 30 天內即放棄記錄。對臺灣民眾而言，「一碗加蛋牛肉麵、半碗湯、一份燙青菜」等複合外食料理，要求手動秤重並拆解食材欄位，認知負擔極高且難以長久維持。\n\n### B. But（現有挑戰與 Research Gap）\n現有飲食追蹤工具存在三大技術與行為瓶頸：\n1. **手動搜尋與記錄負擔過重**：如 MyFitnessPal、Cronometer 等主流工具，仰賴龐大資料庫中精確關鍵字手動匹配與份量輸入，缺乏在地食物（如夜市小吃、混合羹湯）語義理解能力。\n2. **自報飲食攝取誤差巨大**：自我回報熱量之系統性低估誤差常達 18%～54%，隱藏油脂、湯底份量模糊與複合調味擴大了數值估算的不確定性。\n3. **通用 LLM 缺乏資料錨定易生幻覺**：直接詢問未經調校的通用語言模型食物熱量時，其平均絕對百分比誤差（MAPE）高達 35.8%，重量估算誤差達 36.3%，且易產生未經醫學驗證的極端節食建議。\n\n### C. Cure（解藥：提出 DietSense Domain AI Agent）\n為突破上述瓶頸，本研究提出 **DietSense**——一套**以自然語言驅動、資料錨定（Data-Grounded）且具備安全守門機制之領域智慧代理人（Domain AI Agent）**。其核心設計原則為：\n\u003e **「LLM 負責意圖協調與對話互動，領域工具負責客觀取數與精確計算，官方醫學指引負責安全守門。」**\n\n系統透過白名單 Function Calling 串聯多來源可信資料庫與代謝公式，以「熱量信賴區間、信心評分與透明資料來源」取代虛假精確的單一數值。\n\n### D. Development（方法與系統架構）\nDietSense 採用模組化八大 Agent 架構（對應規範 ①～⑧）：\n1. **輸入與語音處理**：整合 Whisper 語音轉文字、繁體中文語意正規化與四類意圖分流（`log_food`, `query_nutrition`, `analyze_trends`, `recommend_diet`）。\n2. **多來源資料錨定（Hybrid RAG）**：結合 USDA FoodData Central（90 萬筆）、臺灣食品成分資料庫，以及自建之「臺灣在地外食向量資料庫（ChromaDB）」。\n3. **Clarification Loop（主動追問機制）**：當料理實體、份量（碗/盤/份）或烹調方式之檢索信心度低於 80% 時，主動向使用者發起多輪對話追問澄清。\n4. **確定性計算與個人化代謝引擎**：採用 Mifflin-St Jeor 公式精確估算基礎代謝率（BMR）與每日總消耗熱量（TDEE），並依衛福部 AMDR 規範計算巨量營養素比例。\n5. **不確定性量化與安全防護層**：傳遞誤差範圍輸出信賴區間；設定每日攝取量 $\u003c 1,200\\text{ kcal}$ 熔斷警告，並自動攔截極端節食與飲食失調（Eating Disorder）語句。\n\n### E. Experiments（評估規劃與驗證設計）\n本專案為提案階段，規劃以嚴謹客觀指標驗證（非虛構已完成數據）：\n1. **標註資料集**：建構 500 筆涵蓋夜市小吃、便當、複合麵食與手搖飲料的真實繁體中文外食語料集，標註標準熱量與巨量營養素範圍。\n2. **基準對比（Baseline）**：以市場龍頭 MyFitnessPal 手動記錄為對照組。\n3. **使用者研究（User Study）**：招募 20 名受試者進行為期 7 天的真實世界飲食追蹤實驗，透過系統可用性量表（SUS, System Usability Scale）與記錄耗時評估互動體驗。\n\n### F. Findings（預期產出與成果目標）\n本專案預期達成之驗證指標與學術貢獻：\n* **準確性指標**：在真實外食情境中，熱量估算在 $\\pm 20\\%$ 容許誤差內之達標率預期高於 **85%**。\n* **使用效率**：相較於傳統手動搜尋輸入，飲食記錄時間預期大幅縮短 **60%**。\n* **可用性評價**：系統可用性評分 SUS 預期達成 **$\u003e 70$ 分**（達 Good 標準）。\n* **學術與實用價值**：展示結合 LLM 協調、在地 RAG 與嚴謹安全邊界的 Domain Agent 如何有效解決自報飲食監測中「高流失、高認知負擔、高估算誤差」的長期公衛痛點。\n\n---\n\n## 二、IEEE Transactions Systems Journal Style Abstract\n\n**Title**—DietSense: A Data-Grounded and Safety-Aware Conversational AI Agent for Personalized Dietary Assessment and Weight Management\n\n**Abstract**—The increasing prevalence of overweight and obesity, affecting an estimated 2.6 billion adults worldwide in 2024, including 940 million individuals living with obesity, underscores the urgent need for sustainable dietary self-monitoring. However, conventional dietary tracking applications impose substantial cognitive burdens, requiring manual food identification, multi-step ingredient search, and portion weight estimation. Self-reported dietary intake errors ranging from 18% to 54% further degrade assessment reliability, particularly for culturally specific mixed dishes. Although large language models (LLMs) enable fluent natural-language interaction, their direct application to nutritional estimation exhibits hallucinated values (caloric MAPE ≈ 35.8%), inconsistent calculations, and unregulated recommendations. To resolve these limitations, this paper proposes **DietSense**, a data-grounded, safety-aware conversational AI agent tailored to traditional Chinese dietary contexts. DietSense establishes a tool-oriented architecture wherein an LLM acts strictly as a reasoning planner coordinating information retrieval through whitelisted function calls, while numerical calculations are delegated to deterministic analytical engines. The framework integrates retrieval-augmented generation (RAG) across the USDA FoodData Central, the Taiwan Food Composition Database, and a specialized vector database of Taiwanese cuisine. Its eight-module architecture features an automated clarification loop that resolves ambiguity in portion sizes and cooking methods whenever confidence drops below 80%. Caloric requirements are calibrated using the Mifflin–St Jeor equation and total daily energy expenditure (TDEE). The evaluation protocol utilizes a curated benchmark of 500 annotated Taiwanese meal descriptions and a planned 7-day user study (N=20). DietSense targets an estimation accuracy exceeding 85% within a ±20% caloric margin, a 60% reduction in logging time relative to manual entry, and a System Usability Scale score exceeding 70. By integrating bounded language reasoning with verifiable domain services, DietSense transitions digital nutrition tracking from burdensome manual logging to transparent, context-aware, and safety-governed health management.\n\n**Index Terms**—Conversational AI, domain-specific AI agents, dietary assessment, large language models, retrieval-augmented generation, uncertainty quantification, personalized weight management, safety-aware systems.\n\n---\n\n## 三、5 Cores（五大核心思維模式）\n\n依據營養學、行為科學與 AI Agent 系統設計共識，提煉五大核心思維：\n\n1. **能量平衡模型（Energy Balance / CICO Principle）**\n   * *核心含意*：體重增減遵循熱力學第一定律（攝入熱量 vs. 消耗熱量）。\n   * *系統設計落實*：系統以 Mifflin-St Jeor 公式計算基礎代謝率（BMR），結合日常活動係數計算 TDEE，作為個人化動態天花板與基準線，杜絕缺乏能量平衡概念的盲目節食。\n2. **巨量營養素比例與代謝效應（Macronutrient Composition \u0026 AMDR）**\n   * *核心含意*：熱量並非唯一維度，碳水化合物（$4\\text{ kcal/g}$）、蛋白質（$4\\text{ kcal/g}$）與脂肪（$9\\text{ kcal/g}$）的供能比例與食物熱效應（TEF）直接影響飽足感、肌肉合成與代謝健康。\n   * *系統設計落實*：落實臺灣衛福部可接受巨量營養素分佈範圍（AMDR），在報告中提供碳水 50-65%、蛋白質 10-20%、脂肪 20-30% 之結構化分解，而非單一只看熱量。\n3. **份量估算的不確定性量化（Portion Uncertainty Quantification）**\n   * *核心含意*：日常外食的份量（「一碗」、「半份」）本質上存在測量噪音與主觀偏差，追求虛假的單點精確（Point Estimate, 如宣稱 634.2 kcal）反而是不科學且誤導使用者的。\n   * *系統設計落實*：計算管線輸出信賴區間（Confidence Interval, 如 $600\\sim 680\\text{ kcal}$），揭露數據來源與假設，並計算信心分數（Confidence Score）。\n4. **個體生理與情境差異（Individual Physiological Variation）**\n   * *核心含意*：相同的飲食攝入在不同年齡、性別、BMI、運動頻率與病史個體上會產生截然不同的代謝反應。\n   * *系統設計落實*：建立個人化 Profile 模組，依使用者生理參數動態更新個人化熱量赤字建議（每日建議赤字 300~500 kcal），避免一刀切的通用處方。\n5. **行為情境意識與長期遵從性（Behavioral Context Awareness \u0026 Adherence）**\n   * *核心含意*：減重失敗的核心瓶頸在於使用者流失與認知疲倦，極端繁瑣的記錄機制必然導致失敗。\n   * *系統設計落實*：以自然語言與語音輸入作為第一接觸面，將單次記錄負擔降至 15 秒內，透過主動追問與正向回饋機制提升長期遵從率。\n\n---\n\n## 四、3 Trade-offs（三大專業爭論與架構權衡）\n\n| 爭論面向 | 觀點 A (Pros \u0026 Cons) | 觀點 B (Pros \u0026 Cons) | 領域現有共識 | DietSense 架構抉擇與落地 |\n| :--- | :--- | :--- | :--- | :--- |\n| **Trade-off 1：\u003cbr/\u003e卡路里數量 vs. 食物品質** | **嚴格熱量赤字說（CICO）**：只要總熱量低於消耗即會減重；缺點是忽視胰島素反應、微量營養素與飢餓感。 | **荷爾蒙／低升糖說**：強調原型食物、低 GI、抗發炎；缺點是若總熱量過剩仍無法達成減重。 | 能量赤字是減重之**必要條件**，而食物品質與巨量比例則是長期維持與健康的**充分條件**。 | **雙軌制呈現**：同時輸出熱量平衡區間（對比 TDEE）與巨量營養品質雷達圖，並在建議模組提出低 GI/高蛋白食材替代建議。 |\n| **Trade-off 2：\u003cbr/\u003e對話估算 vs. 硬體秤重/3D影像** | **純自然語言對話／LLM 估算**：極度便利、門檻最低、支援複雜烹調情境；缺點是精準度受限於使用者回報品質。 | **精確秤重／3D 深度視覺硬體**：測量物理精確度高；缺點是使用者出門在外無法隨身攜帶秤，流失率極高。 | 在公共衛生與日常自主管理中，**「能長期持續的良好估算」遠優於「只能維持三天的完美測量」**。 | **對話為主＋Clarification Loop**：日常採自然語言對話，當關鍵份量模糊時啟動主動追問（如「麵是大碗小碗？」），在便利性與精確度取得最佳折衷。 |\n| **Trade-off 3：\u003cbr/\u003e公共衛生通用指引 vs. 高度精準個人化** | **官方公衛常規飲食指南**：經過大規模流行病學實證、具法律與安全性保護；缺點是無法針對個體基因或代謝微調。 | **基因/腸道菌多體學個人化**：理論上最精準；缺點是商業成本極高、醫療診斷邊界模糊且可能引發醫療糾紛。 | 數位健康工具必須以**「安全性第一」**為底線，不得逾越非醫療軟體的合規邊界。 | **安全性熔斷＋在地指南**：以衛福部國人每日飲食指南為核心基線，設定每日熱量不得低於 1200 kcal 之硬性安全門檻，特殊族群（孕婦、糖尿病）強制引導就醫。 |\n\n---\n\n## 五、10 Details（十大技術實作關鍵細節）\n\n1. **Whisper 語音轉文字與繁簡在地實體正規化**：將口語化語音轉為文字，透過自建正則與辭典將臺灣習慣用語（如「滷肉飯」、「半糖去冰」、「排骨便當」）統一編碼。\n2. **四態意圖分流路由（Intent Router）**：設計高準確意圖分類器，將輸入嚴格分流為飲食記錄（`log_food`）、營養查詢（`query_nutrition`）、趨勢分析（`analyze_trends`）與建議回饋（`recommend_diet`）。\n3. **雙層混合 RAG 檢索機制**：先對「臺灣在地外食向量庫」進行稠密向量檢索（Dense Vector Search），若未命中則回退至「臺灣食品成分資料庫」與 USDA API 進行關鍵字精確匹配。\n4. **Clarification Loop 信心門檻（Confidence Threshold = 80%）**：當檢索相似度或份量抽取信心度 $\u003c 0.80$ 時，觸發追問分支，主動要求使用者補充模糊資訊（例如湯品飲用量、烹調方式）。\n5. **Mifflin-St Jeor 確定性 TDEE 運算引擎**：完全由 Python 確定性數學函式執行能量計算，禁止由 LLM 自行加減乘除，公式嚴格遵循：\n   $$\\text{BMR} = 10 \\times \\text{weight(kg)} + 6.25 \\times \\text{height(cm)} - 5 \\times \\text{age(y)} + s \\quad (s = +5 \\text{ for male}, -161 \\text{ for female})$$\n6. **巨量營養素熱量等價轉換機制**：採用國際標準係數（碳水 $4\\text{ kcal/g}$、蛋白質 $4\\text{ kcal/g}$、脂肪 $9\\text{ kcal/g}$），雙向驗證總熱量與各項總和之一致性。\n7. **不確定性區間動態傳遞**：為每個食物實體標記份量不確定係數（如小吃估計誤差 $\\pm 15\\%$），在多食物加總時透過均方根或誤差傳遞公式輸出信賴區間（例如 $650 \\pm 80\\text{ kcal}$）。\n8. **每日熱量 $\u003c 1,200\\text{ kcal}$ 安全熔斷攔截（Safety Guardrail）**：當使用者設定或每日目標低於 1200 kcal 時，系統強制拒絕產生過度節食計劃，並跳出健康危害警告。\n9. **飲食失調（Eating Disorder）與極端詞彙守門員**：內建心理健康敏感詞庫（如催吐、絕食、強效減肥藥），偵測到異常偏激行為時立即終止減重引導，並提示心理與營養諮詢專線。\n10. **多輪對話狀態機與非侵入式歷史快照**：以結構化 Session State 記錄當日餐別（早/午/晚/點心），使用者可隨時用自然語言追加修改（例如「剛才那杯奶茶其實是微糖」），由 Agent 精確覆寫單項數值。\n\n---\n\n## 六、2020 A-Z SOP 全字母對齊映射總表\n\n| 字母 | A2Z 標準要素名稱 | DietSense 專案具體落地與章節映射 |\n| :---: | :--- | :--- |\n| **A** | **Attention Getter** | 引用 WHO 2025 全球 26 億過重/9.4 億肥胖數據、臺灣成人過重率 47.9% 及 500 億健保負擔。 |\n| **B** | **But (Challenge)** | 指出現有 App 手動輸入繁瑣、在地食物匱乏、自報誤差 18%～54%、85% 一個月內放棄。 |\n| **C** | **Cure (Solution)** | 提出 DietSense：對話式、資料錨定、安全守門之繁體中文領域 AI Agent。 |\n| **D** | **Development (Method)** | 八大模組架構、Whisper + RAG + NER + Mifflin-St Jeor TDEE + 信心度追問迴圈。 |\n| **E** | **Experiments (Evaluation)** | 500 筆在地外食標註資料集、對比 MyFitnessPal、20 人 7 天 User Study 與 SUS 評估。 |\n| **F** | **Findings (Outcomes)** | 預期 $\\pm 20\\%$ 誤差內達標率 $\u003e 85\\%$、記錄時間縮短 $60\\%$、SUS $\u003e 70$ 分。 |\n| **G** | **General 現況** | 全球數位健康體重管理市場達 68 億美元，生活型態介入具顯著慢性病預防效益。 |\n| **H** | **However 挑戰深入** | 深入剖析四認知障礙：查詢負擔、份量模糊、複合菜餚拆解困難、通用 LLM 幻覺嚴重。 |\n| **I** | **In literature 文獻解法** | 梳理文獻歷程：第 1 代手動輸入 $\\to$ 第 2 代影像辨識 $\\to$ 第 3 代對話式 Agent 與 Tool Use 70, 0.80, 0.90）、向量檢索 Top-K 與 Temperature。 |\n| **U** | **Useful Results (預期)** | 預期熱量偏差顯著低於通用 LLM，且記錄耗時從 120 秒降至 45 秒以內。 |\n| **V** | **Verify Effectiveness** | 驗證「資料錨定 + 主動追問」架構能否在真實雜訊環境下保持估算穩健性。 |\n| **W** | **What Proposed 回顧** | 總結 DietSense 如何克服手動記錄疲乏與黑盒模型幻覺的雙重挑戰。 |\n| **X** | **eXcel 專精情境** | 特別專精於臺灣夜市、傳統小吃、便當與手搖飲料等非標準化外食場景。 |\n| **Y** | **Yields 產出成果** | 產出開源外食評估 Benchmark、Agent 實作原型與高滿意度評估數據。 |\n| **Z** | **Zen 結論與未來展望** | 結論強調「可信任 AI」在預防醫學中的關鍵價值；未來將整合穿戴裝置與連續血糖監測（CGM）。 |\n\n\n\n---\n\n# DietSense 專案重構：Introduction 緒論\n\n\u003e 本章節嚴格依據 2020 A-Z SOP 的 **G～L 架構** 與《期末專題提案作業規範》重構，全面回答核心問題：**\"Why is this project worth doing?\"**\n\n---\n\n## G. General 現況（市場爆發、流行病學趨勢與生活型態醫學）\n\n全球公共衛生正面臨代謝異常相關慢性疾病的空前考驗。世界衛生組織（WHO, 2024/2025）流行病學報告指出，全球已有超過 26 億成人處於超重狀態，其中肥胖人口高達 9.4 億；飲食不良與能量失衡已超越吸菸，成為全球非傳染性慢性病（心血管疾病、第 2 型糖尿病、高血壓及脂肪肝）的主要風險因子，佔全球死因之 74%（WHO, 2025）。\n\n在臺灣，衛生福利部國民健康署 2024–2025 年度國民營養健康調查顯示，18 歲以上成年人過重及肥胖盛行率達到 **47.9%**，相當於每兩位成年人中即有一人面臨體重過重風險。健保署統計數據進一步表明，因肥胖引發之代謝症候群、心血管事件與洗腎等併發症，每年造成的直接與間接醫療支出超過新台幣 **500 億元**。\n\n在此嚴峻背景下，**「生活型態醫學（Lifestyle Medicine）」與日常「飲食自我監測（Dietary Self-Monitoring）」**被國際臨床醫學證實為體重管理最有效、最具成本效益的干預手段。最新臨床隨機對照試驗顯示（Teixeira et al., 2025），能長期保持每週至少 5 天飲食記錄的受試者，達成 5% 以上顯著減重目標的成功率是未記錄者的 **2.1 倍**。受到此一醫學實證推動，全球數位健康與智慧飲食管理應用市場急速成長，市場調研機構 Grand View Research（2025）評估全球飲食追蹤與數位健康市場規模已達 **68 億美元**，預計 2025–2030 年間將以 17.4% 的年複合成長率（CAGR）持續擴張，顯示公眾與醫療機構對數位化營養輔助系統存在巨大的真實需求。\n\n---\n\n## H. However 挑戰深入（四項核心認知障礙與行為瓶頸）\n\n儘管飲食自我監測在臨床上極具價值，但現有工具的實際使用率與長期留存率卻呈現慘澹對比。著名的 SMARTER 臨床行為試驗（Burke et al.）及後續數位追蹤研究均揭示：**高達 85% 的使用者在開始記錄後的 30 天內即停止使用**，留存率曲線呈現斷崖式非線性下滑，且基線 BMI 較高（即最需要介入）的使用者，其遵從率反而最低。\n\n本研究深入分析使用者行為與心理負擔，將現有飲食追蹤工具的根本瓶頸歸納為**四大核心障礙**：\n\n1. **手動搜尋與分解的高認知負擔（Search \u0026 Decomposition Friction）**：\n   現行主流 App（如 MyFitnessPal、FatSecret、Cronometer）採取傳統表單式設計。使用者進食後，必須在數十萬筆食物清單中逐一搜尋食材名稱、選擇品牌、估算物理克數。當面對混合烹調菜餚時，系統強迫使用者在腦中將其逆向拆解為生鮮原料（例如將「一碗餛飩湯」拆解為絞肉、麵皮、高湯、香油、芹菜），這在快速用餐與外食環境中造成了嚴重的心理抗拒與認知過載。\n2. **份量估算的主觀模糊與系統性偏差（Portion Ambiguity \u0026 Misreporting）**：\n   流行病學與營養評估文獻（Poslusna et al., 2024; Subar et al.）反覆證實，一般人在自我回報飲食攝取量時，存在高達 **18% 至 54% 的系統性低估誤差**。人們普遍對容器容量（「碗」、「杯」、「盤」）缺乏精確概念，且極易忽略烹調過程中的「隱藏油脂」、「糖分佐料」與「濃郁湯底」，導致最終記錄之卡路里數值失真，喪失追蹤與指導價值。\n3. **臺灣本土飲食文化的嚴重覆蓋缺口（Cultural Food Gap）**：\n   主流商業軟體多發源於歐美，其營養成分庫（如 USDA 或歐美品牌包裝食品）對東亞，尤其是臺灣極具特色的「外食小吃、夜市餐飲、複合自助餐、手搖茶飲」覆蓋率極度匱乏。當臺灣使用者搜尋「蚵仔煎、大腸包小腸、排骨便當、半糖微冰四季春」時，系統往往查無此項，或只能匹配到毫無關聯的西方近似食物，迫使使用者放棄記錄。\n4. **通用大型語言模型（LLM）的黑盒幻覺與安全隱憂（LLM Hallucination \u0026 Safety Risks）**：\n   隨著生成式 AI 普及，許多使用者嘗試直接向 ChatGPT 等通用聊天機器人詢問「我今天這餐有多少熱量？」。然而最新實證評估研究顯示（Frontiers in Nutrition, 2025），未經資料錨定與專業微調的通用 LLM 在估算食物熱量時，其**平均絕對百分比誤差（MAPE）高達 35.8%**，且對重量估算的 MAPE 亦達 36.3%，經常隨機捏造數值（Hallucination）。更危險的是，通用 LLM 缺乏醫學安全邊界，可能對追求極端減重的個體給出每日低於 800 kcal 的病理性建議，潛藏誘發厭食症或營養不良的重大公共安全風險。\n\n---\n\n## I. In literature 文獻解法演進（從手動記錄到智慧代理的三代轉移）\n\n回顧資訊科技與人機互動（HCI）在飲食監測領域的演進歷程，文獻與產業發展經歷了三代主要典範：\n\n```mermaid\nflowchart LR\n    G1[\"第一代：結構化表單\u003cbr/\u003e(1990s - 2010s)\u003cbr/\u003eMyFitnessPal, Cronometer\"] --\u003e G2[\"第二代：電腦視覺辨識\u003cbr/\u003e(2015 - 2023)\u003cbr/\u003eFood-101, SnapCalorie\"]\n    G2 --\u003e G3[\"第三代：對話式 Agent 與 RAG\u003cbr/\u003e(2023 至今)\u003cbr/\u003eDietSense 領域智慧代理\"]\n```\n\n1. **第一代：結構化資料庫與手動檢索系統（1990s–2010s）**：\n   以 MyFitnessPal、Cronometer 為代表。其架構本質上是關聯式資料庫的前端 GUI。優點是資料結構透明、支援條碼掃描；致命缺點是記錄摩擦力巨大，將數據標準化的負擔完全轉嫁給終端使用者，導致長期留存率低於 15%。\n2. **第二代：基於電腦視覺的相機拍照識別系統（2015–2023）**：\n   隨著卷積神經網路（CNN）與 Vision Transformer（ViT）成熟，如 Food-101、SnapCalorie 等研究嘗試透過智慧型手機鏡頭直接辨識餐盤內容。然而實務驗證發現，2D 影像無法穿透視角盲區，無法偵測食物內部隱藏的油脂與糖分，更難以估算羹湯、火鍋等高水分菜餚的實際固形物重量，其整體熱量估算誤差仍達 30% 以上，且在公共用餐場合拍照記錄易引起社交尷尬。\n3. **第三代：自然語言對話、RAG 資料錨定與智慧代理架構（2023 至今，新興前沿）**：\n   利用大型語言模型（LLM）強大的上下文理解與常識推理能力，使用者僅需以自然的日常口語（文字或語音）描述餐點，由 Agent 負責實體辨識、情境推論與追問。然而，現有研究多停留在 Prompt Engineering 或單純呼叫單一向量資料庫，尚未建立起**「意圖分流、在地資料檢索、確定性代謝計算、不確定性傳遞與醫學安全守門」**一體化的完整領域架構。\n\n---\n\n## J. Judgement 方法優缺點評析與 SWOT 分析\n\n為釐清既有技術方案與本研究提案之差異，本研究將現存主流方法進行系統化對比與 SWOT 評判：\n\n| 方案維度 | 第一代：手動搜尋 App | 第二代：拍照視覺 AI | 通用對話 LLM（無工具） | **DietSense（本提案 Domain AI Agent）** |\n| :--- | :--- | :--- | :--- | :--- |\n| **輸入方式** | 多層階層式表單搜尋 | 手機相機拍攝 2D 照片 | 純文字提示詞問答 | **自然語言（語音／文字）對話式互動** |\n| **操作負擔** | 極高（單餐平均需耗時 90~150 秒） | 低（拍照僅需 5 秒） | 極低（輸入一段文字約 15 秒） | **極低（語音輸入約 10~15 秒完成）** |\n| **在地飲食覆蓋** | 依賴使用者 UGC，品質良莠不齊 | 受限於西方資料庫訓練集 | 能理解台式菜名但營養數值失真 | **自建臺灣外食小吃向量庫 + 官方成分庫** |\n| **隱藏成分推理** | 需手動手動調整油鹽選項 | 完全無法穿透 2D 外觀 | 具有推理概念但數值純靠猜測 | **透過 Clarification Loop 主動追問釐清** |\n| **數值可信度** | 高（官方項目）至低（網友輸入） | 中等（體積估算誤差大） | 極低（幻覺嚴重，MAPE $\\approx 35.8\\%$） | **極高（白名單資料庫確定性計算，拒絕幻覺）** |\n| **結果呈現型態** | 偽精確之單一數值 | 預測單一數值 | 隨機單一數值 | **動態信賴區間（例如 $650 \\pm 80\\text{ kcal}$）** |\n| **安全守門機制** | 無（僅有靜態警告） | 無 | 弱（可能附和偏激節食行為） | **強（內建 $\u003c1200\\text{ kcal}$ 熔斷與失調攔截）** |\n\n**核心判斷（Judgement）**：\n純科技無法解決複雜的健康行為問題。純手動工具太痛苦，純視覺工具不精確，純生成模型不可靠。唯一可行的工程路徑是**「將 LLM 限制為對話協調者與推理引擎，將計算與資料權限交還給經過檢驗的領域工具與確定性資料庫」**。\n\n---\n\n## K. Keypoint 設計精神、核心亮點與預期貢獻（Contribution Summary）\n\n本專案提出 **DietSense** 系統，其核心設計精神在於實現從「被動式熱量追蹤（Passive Calorie Tracking）」邁向「主動式、情境感知的個人化體重管理（Proactive, Context-Aware Weight Management）」。\n\n本專案確認之**四大核心亮點**：\n1. **自然語言輸入（Natural Language Input）**：支援繁體中文日常口語與語音輸入，透過 Whisper 與實體辨識，免除階層式表單操作。\n2. **主動式智慧互動（Proactive Agentic Interaction）**：內建動態 Clarification Loop，當檢索信心低於 80% 時主動追問份量與烹調細節，告別死板問答。\n3. **情境感知（Context Awareness）**：整合個人身體素質、歷史飲食趨勢、生理目標與用餐時段，動態給予適切指引。\n4. **大數據驅動智慧（Big Data–Driven Intelligence）**：整合臺灣衛福部食品資料庫、USDA FoodData Central 與在地外食向量庫，提供具可解釋性、可追溯性的數據支撐。\n\n**主要研究與工程貢獻（Contribution Summary）**：\n* **架構創新**：提出一套解耦「自然語言意圖理解」與「數值計算」的八模組 Domain AI Agent 架構，為醫療健康領域 LLM 落地提供可稽核的安全典範。\n* **在地資源貢獻**：規劃建置 500 筆高質量臺灣特色外食（夜市小吃、便當、手搖茶飲）標註基準測試集（Benchmark），填補現有學術研究之在地資料庫空白。\n* **人機互動突破**：透過主動追問與信賴區間呈現，預期將記錄耗時縮短 60%、$\\pm 20\\%$ 估算達標率提升至 85% 以上，顯著改善長期飲食監測之使用者遵從性。\n\n---\n\n## L. List Organization 文章結構交代\n\n本提案文件後續章節組織如下：\n* **第 2 節（Related Work \u0026 Deep Research）**：深入梳理 AI 代理技術與營養代謝領域之最新文獻，建立 5 篇文獻摘要表（Article Summary Table），並完整剖析 5 大核心思維、3 大專業爭論與 10 個深度問題。\n* **第 3 節（Proposed Scheme \u0026 Design Workflow）**：依據 PA～PM 規範詳細展開 DietSense 八大模組架構、系統資料流、核心演算法 Pseudocode（Algorithm 1）與不確定性傳遞模型。\n* **第 4 節（Experiments \u0026 Evaluation Plan）**：說明 500 筆在地外食資料集規劃、與 MyFitnessPal 之 Baseline 對比實驗設計，以及 20 名受試者為期 7 天之使用者研究（User Study）評估指標。\n* **第 5 節（Conclusion \u0026 Future Work）**：總結本專案之預期產出、工程限制與未來多模態及連續生理監測之擴展規劃。\n\n\n\n---\n\n# DietSense 專案重構：Related Work 相關研究\n\n\u003e 本章節嚴格依據 2020 A-Z SOP 之 **M～O 架構** 與《期末專題提案作業規範》重構，維持 **約 1/2 AI 技術 + 1/2 領域知識（Domain Know-how）** 之黃金比例，並附上完整之 **Article Summary Table**，收斂出關鍵的 Research Gap。\n\n---\n\n## M. Methods 文獻方法分類與深度剖析\n\n本研究將既有相關研究劃分為「AI 核心技術」與「營養代謝領域知識」兩大支柱，各佔 50% 之深度探討：\n\n### 1. AI 核心技術支柱（約 50% AI Technology）\n\n```mermaid\nflowchart TD\n    AI[\"AI 技術支柱\"]\n    AI --\u003e M1[\"LLM 與 Tool Use (Function Calling)\u003cbr/\u003e將大模型限制在規劃與路由，白名單呼叫API\"]\n    AI --\u003e M2[\"檢索增強生成 (Hybrid RAG)\u003cbr/\u003e結合 Dense Vector (台灣小吃) 與 Sparse SQL (成分庫)\"]\n    AI --\u003e M3[\"食物命名實體識別 (Food NER)\u003cbr/\u003e從繁中口語中抽離食材、份量修飾詞、餐別\"]\n    AI --\u003e M4[\"多模態與不確定性量化\u003cbr/\u003e蒙地卡羅誤差傳遞與區間估計\"]\n```\n\n* **大型語言模型之工具調用架構（LLM with Tool Use / Function Calling）**：\n  近期研究（Schick et al., Toolformer; Yao et al., ReAct, 2023–2024）指出，LLM 在處理開放式對話時展現出強大的人類意圖理解能力，但在直接執行算術計算與精確數據檢索時極易產生幻覺。最新的架構趨勢是將 LLM 定位為「Reasoning \u0026 Orchestration Engine」，模型本身不儲存數據，而是透過白名單宣告之 Function Calling 介面，生成標準 JSON 參數並調用後端微服務（Deterministic Microservices），從根本上消除算術幻覺。\n* **雙層檢索增強生成（Hybrid RAG for Nutrition）**：\n  單純向量檢索在處理「份量數量詞」或「成分比例」時常出現維度稀疏失真。新興文獻建議結合基於語意 Embedding 的稠密向量檢索（Dense Retrieval，適用於在地小吃俗名匹配）與基於關聯式資料庫的精確 SQL 查詢（Sparse/Symbolic Retrieval，適用於官方標準食品成分庫），達成多來源數據錨定。\n* **繁體中文食物命名實體識別（Food-NER \u0026 Quantity Parsing）**：\n  中文缺乏天然空格分詞，且飲食描述高度依賴量詞搭配（例如「一碗麵」、「半份豆干」、「兩塊排骨」）。現行研究透過微調 BERT、RoBERTa 或利用 Few-shot In-context Learning，專門抽取三個核心槽位（Slots）：`Food_Entity`（食物名稱）、`Portion_Quantity`（份量與容器）、`Cooking_Method`（烹調/加工方式，如炸、煎、清蒸、去皮）。\n* **不確定性量化與信賴區間傳遞（Uncertainty Quantification）**：\n  在人機協作系統中，單點估計（Point Estimation）無法反映模型對外食隱藏成份的認知邊界。引入貝氏神經網路或啟發式區間傳遞公式，使 Agent 能夠以「$\\text{熱量} \\in [\\text{下限}, \\text{上限}]$，信心度 $C \\in [0, 1]$」的形式對外通報，當 $C \u003c 0.8$ 時主動進入澄清機制。\n\n### 2. 營養代謝領域知識支柱（約 50% Domain Know-how）\n\n```mermaid\nflowchart TD\n    Domain[\"營養代謝領域知識\"]\n    Domain --\u003e D1[\"人體能量代謝平衡模型\u003cbr/\u003eCICO, BMR (Mifflin-St Jeor), TDEE, TEF\"]\n    Domain --\u003e D2[\"巨量營養素與 AMDR 指南\u003cbr/\u003e碳水 50-65%, 蛋白質 10-20%, 脂肪 20-30%\"]\n    Domain --\u003e D3[\"食物份量標準化與換算常數\u003cbr/\u003e碳水/蛋白 4 kcal/g, 脂肪 9 kcal/g, 常用器皿容量\"]\n    Domain --\u003e D4[\"臨床醫學安全邊界\u003cbr/\u003e每日熱量下限 1200 kcal, 飲食失調警示\"]\n```\n\n* **動態能量平衡模型與代謝計算（Energy Balance \u0026 Metabolic Equations）**：\n  人體體重變化本質上遵循能量守恆定律（Hall et al., 2011, *The Lancet*）：\n  $$\\Delta \\text{Body Weight} \\approx \\frac{\\int (\\text{Energy In} - \\text{Energy Out}) \\, dt}{\\rho_{\\text{tissue}}}$$\n  其中能量消耗（TDEE）由三部分組成：基礎代謝率（BMR, 佔 60–75%）、食物熱效應（TEF, 佔約 10%）與身體活動消耗（TEA, 佔 15–30%）。臨床營養學實證顯示，**Mifflin-St Jeor 公式**在預測健康與肥胖成年人之靜態能量消耗時，其準確率顯著優於傳統 Harris-Benedict 公式（相差 $\u003c 10\\%$ 之人口比例最高達 82%），本專案選定其作為確定性運算基石。\n* **巨量營養素比例（AMDR）與生化供能常數**：\n  依據衛生福利部國民健康署《國人膳食營養素參考攝取量》（DRIs），成人可接受巨量營養素分配範圍（AMDR）為：蛋白質 10–20%、脂質 20–30%、碳水化合物 50–65%。每公克碳水化合物提供 $4\\text{ kcal}$、蛋白質提供 $4\\text{ kcal}$、脂肪提供 $9\\text{ kcal}$。系統必須確保巨量營養素之加權熱量嚴格等於總估計熱量，杜絕數值邏輯矛盾。\n* **臺灣在地外食文化與容器換算常數（Local Portion Metrics）**：\n  臺灣餐飲具有極高比例的外食人口與獨特的容器計量標準。例如標準免洗紙餐盒容量約 $650\\sim 800\\text{ ml}$、小吃攤普通麵碗容量約 $600\\text{ ml}$、手搖杯大杯標準為 $700\\text{ ml}$。此外，滷味、鹽酥雞、夜市炸物等烹調過程中的吸油率（通常使總熱量增加 15%～35%）與湯麵羹湯之鈉含量與熱量，必須納入領域知識庫之加權因子。\n* **臨床安全底線與飲食失調防護（Clinical Safety Boundaries）**：\n  美國運動醫學會（ACSM）與臨床指引明訂，未經醫師監督之極低熱量飲食（VLCD, $\u003c 800\\text{ kcal/day}$）可能導致電解質失衡、膽結石與心律不整。女性每日最低安全攝取量不得低於 $1,200\\text{ kcal}$，男性不得低於 $1,500\\text{ kcal}$。AI 系統若在缺乏安全規則的情況下盲目鼓勵熱量赤字，極易助長神經性厭食症（Anorexia Nervosa）或暴食症，因此系統必須具備非同步規則守門員。\n\n---\n\n## N. New Proposed 本專案之新趨勢與架構創新\n\n相較於既有文獻，本研究提出的 **DietSense** 具備三大架構級新穎性（Novelty）：\n\n1. **從「靜態黑盒生成」轉向「動態白名單工具協調」**：\n   摒棄將所有對話、檢索與算術全部交由神經網路直接輸出的黑盒作法，建立嚴格的工具調用管線，將自然語言轉化為結構化參數，並由確定性邏輯保證數值計算之數學精確性。\n2. **導入「Clarification Loop（主動追問迴圈）」解決自報資訊不完整**：\n   傳統系統在使用者輸入「我吃了牛肉麵」時，往往隨意假設一個固定均值（例如預設 600 kcal）。DietSense 透過計算相似度與實體完整度，當信心不足時主動以非侵入式方式追問關鍵變數（「請問是清燉還是紅燒？湯有喝完嗎？」），在最小對話輪次內顯著收斂估算誤差。\n3. **首套結合「臺灣食品成分資料庫 + 在地外食向量庫」之繁體中文專用 Agent**：\n   專為臺灣在地飲食生態設計，打通官方標準食材成分與非標準化庶民小吃（便當、夜市小吃、手搖飲）之間的語義與營養對應斷層。\n\n---\n\n## O. Organize 文獻整理、比較表與 Research Gap 歸納\n\n### 1. Article Summary Table（五篇關鍵文獻系統化比較）\n\n| Ref. | Year | Problem Addressed | AI Method Applied | Domain Knowledge Integrated | Dataset / Scale | Key Findings | Critical Limitations |\n| :---: | :---: | :--- | :--- | :--- | :--- | :--- | :--- |\n| **[1]** | 2025 | 自然語言飲食回報之營養素自動提取 | GPT-4 + RAG 檢索增強管線 | USDA FoodData 營養資料庫 | 24 小時飲食回顧語料（1,200 筆臨床數據） | 飲食辨識達標率達 82%（對標臨床營養師專業評估） | 僅支援英文純食材描述；無法處理東亞複合調味與湯品菜餚。 |\n| **[2]** | 2024 | 飲食照片之食物類別與卡路里估算 | EfficientNet-B4 + 密度回歸網路 | Food-101 份量標準與克數對照 | Food-101 基準資料集（101 類，75,750 張影像） | Top-5 分類準確率達 89.2% | 無法穿透 2D 外觀辨識深層隱藏油脂、調味料與湯底內含物。 |\n| **[3]** | 2025 | 個人化大型語言模型健康飲食建議 | LLaMA-3 (8B) 領域微調（SFT） | 國際臨床營養指引與 DRI 標準 | 臨床對話日誌與 MyFitnessPal 社群日誌（5 萬筆） | 違反臨床常規之幻覺建議減少 43% | 缺乏外部即時資料庫連結，熱量數值仍由參數量化輸出，無法提供可稽核來源。 |\n| **[4]** | 2024 | 對話式日常食物記錄之時間效率優化 | GPT-3.5-Turbo + Function Calling | 基礎巨量營養素常數（4/4/9） | 500 次使用者真實交互記錄 | 記錄平均耗時較表單式 App 縮短約 3 倍（至 40 秒） | 份量模糊時採隨機均值填充，缺乏主動澄清機制，數值誤差仍大。 |\n| **[5]** | 2025 | 臺灣本土傳統料理影像辨識 | YOLOv8-X 物件偵測 + ResNet 分類 | 臺灣衛福部食品成分資料庫 | 自採 5 萬張臺灣在地小吃與夜市菜餚圖片集 | 在地小吃類別辨識準確率達 76.4% | 受光線、角度與容器遮擋影響極大；需高品質拍攝，在日常外食環境難以普及。 |\n\n### 2. 核心文獻邏輯收斂鏈條（Research Gap Convergence）\n\n```mermaid\nflowchart TD\n    ER[\"Existing Research (既有研究現況)\u003cbr/\u003e① 英文 NLP 飲食回顧檢索 [1]\u003cbr/\u003e② 2D 照片視覺食物辨識 [2, 5]\u003cbr/\u003e③ 微調 LLM 提供飲食諮詢 [3]\u003cbr/\u003e④ 基礎 Function Calling 記錄 [4]\"]\n    \n    LIMIT[\"Limitations (既有技術瓶頸)\u003cbr/\u003e● 缺乏臺灣在地非標準化小吃支援\u003cbr/\u003e● 2D 視覺無法探知隱藏油脂與調味\u003cbr/\u003e● 純語言模型數值幻覺嚴重 (MAPE 35.8%)\u003cbr/\u003e● 缺乏主動追問機制與醫療安全熔斷\"]\n    \n    GAP[\"Research Gap (關鍵學術缺口)\u003cbr/\u003e學術界與產業界至今缺乏一套同時整合：\u003cbr/\u003e【繁中對話 NLU】+【臺灣在地 Hybrid RAG】+\u003cbr/\u003e【確定性代謝計算引擎】+【動態澄清追問】+【不確定性區間量化】\u003cbr/\u003e的可驗證、可稽核安全 Domain AI Agent 架構。\"]\n    \n    OUR[\"Our Project: DietSense (本專案解方)\u003cbr/\u003e以 LLM 作為 Orchestrator，搭配確定性計算與官方安全邊界，\u003cbr/\u003e在 500 筆臺灣在地外食基準集上實現準確率 \u003e85% (±20% 誤差內)、記錄耗時縮短 60%。\"]\n\n    ER --\u003e LIMIT --\u003e GAP --\u003e OUR\n```\n\n\n\n---\n\n# DietSense 專案重構：Proposed Scheme 與設計工作流（Workflow）\n\n\u003e 本章節嚴格依據 2020 A-Z SOP 之 **PA～PM 結構** 與《期末專題提案作業規範》重構，呈現可落地的 Domain AI Agent 系統設計。\n\n---\n\n## PA. Aim 目標陳述\n打造全臺首套兼顧繁體中文自然語言理解、在地飲食資料庫錨定、確定性代謝運算與臨床醫學安全邊界的領域智慧代理人（Domain AI Agent）——**DietSense**，實現從被動、繁瑣的手動熱量記錄，躍升為「主動、低認知負擔、情境感知與可解釋性」的個人化體重管理。\n\n## PB. Based-on 理論與科學基礎\n系統架構植基於三大科學基石：\n1. **能量守恆與熱力學代謝定律**：遵循 Mifflin-St Jeor 公式與 TDEE 乘數模型，提供科學化的動態能量消耗參考基準。\n2. **衛生福利部《國人膳食營養素參考攝取量》（DRIs）與每日飲食指南**：確立碳水化合物（50-65%）、蛋白質（10-20%）與脂肪（20-30%）之供能比例底線。\n3. **Spec-Driven Agentic Architecture**：基於 OpenSpec 規範，實施「理解與計算解耦」、「白名單工具隔離」與「確定性微服務」原則。\n\n## PC. Cure \u0026 Cause 解法及有用的根本原因\n通用聊天機器人失敗的根本原因在於將「文字生成」與「數值計算」混為一談，導致隨機幻覺。DietSense 成功的核心在於：\n\u003e **「以 LLM 作為 Orchestrator（協調者），專司意圖分類、槽位抽取與對話引導；將資料檢索交由 Hybrid RAG，將算術計算交由 Python 確定性引擎，將醫學邊界交由硬性安全規則庫。」**\n\n## PD. Design 架構典範轉移\n實現兩大維度的典範轉移（Paradigm Shift）：\n* **從 Form-Based GUI $\\to$ Conversational CUI + Proactive Loops**：使用者不再逐層點選搜尋，而是透過語音／文字隨意描述，系統於關鍵資訊缺漏時發起主動追問（Clarification Loop）。\n* **從 Point Estimate $\\to$ Interval Estimate with Traceable Sources**：不再提供虛假精確的單一數值（例如 634 kcal），而是提供可信區間（例如 $600\\sim 670\\text{ kcal}$）、信心分數及引用的資料庫條目來源。\n\n---\n\n## PE. Paper Elements 八大系統架構模組（對應規範 ①～⑧）\n\n```mermaid\nflowchart TD\n    subgraph UI_Layer[\"① 用戶情境層 (User Context)\"]\n        U1[\"文字/語音日常飲食描述\u003cbr/\u003e例如：『中午吃了一碗牛肉麵加蛋，湯喝半碗』\"]\n    end\n\n    subgraph Input_Layer[\"② 輸入前處理層 (Input Processing)\"]\n        I1[\"Whisper-large-v3 語音轉文字\"]\n        I2[\"繁體中文語意正規化\"]\n        I3[\"四態意圖分流路由 (Intent Router)\"]\n    end\n\n    subgraph Planner_Layer[\"③ 規劃與推理層 (Planner \u0026 Reasoning Agent)\"]\n        P1[\"LLM Planner (任務分解 \u0026 Session 記憶)\"]\n        P2[\"Food-NER 實體抽取 (食材/份量/烹調)\"]\n        P3{\"檢索信心度 \u003e 80% ?\"}\n        P4[\"Clarification Loop (主動追問子迴圈)\"]\n    end\n\n    subgraph Data_Layer[\"④ 資料取得與檢索層 (Data Acquisition \u0026 Retrieval)\"]\n        D1[(\"臺灣在地小吃向量資料庫\u003cbr/\u003eChromaDB\")]\n        D2[(\"臺灣食品成分資料庫\u003cbr/\u003e衛福部食藥署\")]\n        D3[(\"USDA FoodData Central API\")]\n        D4[(\"使用者歷史紀錄與個人檔案\")]\n    end\n\n    subgraph Engine_Layer[\"⑤ 分析與代謝計算引擎 (Analytics Engine)\"]\n        E1[\"確定性熱量等價換算 E = Σ(W_i * K_i / 100)\"]\n        E2[\"Mifflin-St Jeor BMR / TDEE 運算模組\"]\n        E3[\"巨量營養素供能分佈 (4/4/9 規則)\"]\n        E4[\"蒙地卡羅不確定性區間估算\"]\n    end\n\n    subgraph Domain_Layer[\"⑥ 領域知識與安全規則層 (Domain Knowledge \u0026 Safety)\"]\n        S1[\"每日熱量 \u003c 1200 kcal 熔斷攔截網\"]\n        S2[\"飲食失調 (Eating Disorder) 關鍵詞過濾\"]\n        S3[\"衛福部國人每日飲食指南基準線\"]\n    end\n\n    subgraph Decision_Layer[\"⑦ 決策與建議生成層 (Decision \u0026 Recommendation)\"]\n        DEC1[\"個人化熱量赤字/盈餘分析\"]\n        DEC2[\"健康食材置換建議 (如高纖/低GI)\"]\n        DEC3[\"安全警告與衛教提示生成\"]\n    end\n\n    subgraph Output_Layer[\"⑧ 輸出與多模態互動層 (Output \u0026 Interaction)\"]\n        O1[\"結構化熱量與營養素卡片 (含信賴區間)\"]\n        O2[\"營養佔比雷達圖與 TDEE 差距條形圖\"]\n        O3[\"自然語言正向回饋與對話引導\"]\n    end\n\n    UI_Layer --\u003e Input_Layer\n    Input_Layer --\u003e Planner_Layer\n    Planner_Layer --\u003e|需要檢索資料| Data_Layer\n    Data_Layer --\u003e Planner_Layer\n    Planner_Layer -- No: 信心不足 --\u003e P4\n    P4 -.-\u003e|追問使用者| U1\n    Planner_Layer -- Yes: 信心充足以調用計算 --\u003e Engine_Layer\n    Engine_Layer --\u003e Domain_Layer\n    Domain_Layer --\u003e Decision_Layer\n    Decision_Layer --\u003e Output_Layer\n```\n\n* **① 用戶情境（User Scenario）**：支援真實日常用餐情境的口語輸入（文字或語音）。\n* **② 輸入處理（Input Processing）**：Whisper 語音轉文字、臺灣飲食詞彙繁簡標準化，透過分類模型判定意圖（`log_food`, `query_nutrition`, `analyze_trends`, `recommend_diet`）。\n* **③ 規劃與推理（Planner \u0026 Reasoning Agent）**：LLM 充當大腦，管理多輪對話 Context；若實體不完整或相似度過低，自動觸發 Clarification Loop。\n* **④ 資料檢索（Data Acquisition \u0026 Retrieval）**：結合臺灣在地小吃向量庫、臺灣食品成分庫與 USDA API，提供精確營養素矩陣。\n* **⑤ 分析引擎（Analytics Engine）**：由純 Python 數學函式構成，執行食材重量熱量積分計算、Mifflin-St Jeor TDEE 運算與不確定性區間估算。\n* **⑥ 領域知識整合（Domain Knowledge Integration）**：整合臺灣每日飲食指南、AMDR 比例，並配置硬性安全檢查規則（低熱量限制與偏激節食防護）。\n* **⑦ 決策建議（Decision \u0026 Recommendation）**：計算當日累積赤字、蛋白質攝取缺口，並提供具體可行的外食健康替代選項。\n* **⑧ 輸出互動（Output \u0026 Interaction）**：產出結構化卡片、信賴區間、資料來源標籤以及個人化對話式總結。\n\n---\n\n## PF. Formulation \u0026 Foundation 核心數學模型\n\n### 1. 飲食總熱量確定性計算模型\n設一餐包含 $N$ 種食物成分，第 $i$ 種食物之估計重量為 $W_i$（公克），檢索所得該食物每 100 公克之熱量為 $K_i$（$\\text{kcal/100g}$），則總攝入熱量 $E_{\\text{total}}$ 為：\n$$E_{\\text{total}} = \\sum_{i=1}^{N} \\left( \\frac{W_i}{100} \\times K_i \\right)$$\n\n巨量營養素校驗公式（驗證計算無矛盾）：\n$$E_{\\text{macro}} = 4 \\times \\text{Carb(g)} + 4 \\times \\text{Protein(g)} + 9 \\times \\text{Fat(g)}$$\n系統約束：$|E_{\\text{total}} - E_{\\text{macro}}| \u003c \\epsilon$（$\\epsilon \\le 2\\text{ kcal}$，允許捨入誤差）。\n\n### 2. Mifflin-St Jeor 代謝公式與 TDEE\n基礎代謝率（BMR）：\n$$\\text{BMR} = 10 \\times \\text{Weight(kg)} + 6.25 \\times \\text{Height(cm)} - 5 \\times \\text{Age(years)} + s$$\n其中性別偏移常數：男性 $s = +5$；女性 $s = -161$。\n\n每日總能量消耗（TDEE）：\n$$\\text{TDEE} = \\text{BMR} \\times \\text{Activity\\_Factor}$$\n（久坐型 1.2，輕度活動 1.375，中度活動 1.55，重度活動 1.725）。\n\n---\n\n## PG. Graph 架構說明\n（參見上述 PE 之 Mermaid 完整架構拓撲圖）\n\n---\n\n## PH. How 系統工程落實方式\n系統採用現代分散式微服務架構，後端由 FastAPI 驅動，LLM 核心介接 OpenAI / Google Gemini API，在地食物向量庫採用 ChromaDB，向量模型採用 `text-embedding-3-small`，資料庫查詢透過 SQLAlchemy 介接官方食品成分資料庫。\n\n---\n\n## PI. Implementation 核心演算法偽代碼（Algorithm 1）\n\n```python\n01: Algorithm 1: DietSense_Core_Orchestrator\n02: Input : user_input Q (text/audio), user_profile P, daily_log D\n03: Output: response R (analysis, visual_card, recommendation, log_update)\n04: ---------------------------------------------------------------------------------\n05: 01: text ← Preprocess_And_Normalize(Q)                  // Whisper ASR + 繁簡校正\n06: 02: intent ← Classify_Intent(text)                      // log / query / analyze / recommend\n07: 03: IF intent == \"log_food\" THEN\n08: 04:     food_entities ← Extract_Food_Entities(text)    // NER: 食物名稱、數量量詞、烹調法\n09: 05:     verified_items ← []\n10: 06:     FOR EACH entity IN food_entities DO\n11: 07:         candidates, sim_score ← Retrieve_Hybrid_RAG(entity.name) // 查在地向量庫與官方庫\n12: 08:         // 信心評估：若相似度或份量模糊度未達門檻，發起澄清追問\n13: 09:         WHILE sim_score \u003c 0.80 OR entity.portion_is_ambiguous DO\n14: 10:             clarification_question ← Generate_Clarification_Prompt(entity, candidates)\n15: 11:             user_reply ← Ask_User(clarification_question)\n16: 12:             entity ← Update_Entity_With_Context(entity, user_reply)\n17: 13:             candidates, sim_score ← Retrieve_Hybrid_RAG(entity.name)\n18: 14:         END WHILE\n19: 15:         portion_interval ← Quantize_Portion_Weight(entity.portion, entity.context)\n20: 16:         kcal_interval, macros ← Compute_Deterministic_Nutrition(candidates[0], portion_interval)\n21: 17:         verified_items.append({item: candidates[0], weight: portion_interval, kcal: kcal_interval, macros: macros})\n22: 18:     END FOR\n23: 19:     D.append(verified_items)                        // 更新當日紀錄\n24: 20: END IF\n25: 21: \n26: 22: // 計算當日能量平衡與個人化分析\n27: 23: daily_totals, total_interval ← Aggregate_Daily_Nutrients(D)\n28: 24: bmr ← Compute_Mifflin_St_Jeor(P.weight, P.height, P.age, P.gender)\n29: 25: tdee ← bmr * P.activity_factor\n30: 26: energy_balance ← daily_totals.kcal - tdee\n31: 27: \n32: 28: // 安全守門與醫學邊界檢查 (Safety Guardrail)\n33: 29: safety_status ← Evaluate_Clinical_Safety(daily_totals, P, text)\n34: 30: IF safety_status.violation_detected THEN\n35: 31:     recommendation ← Trigger_Safety_Intervention(safety_status.type) // 拒絕偏激節食，提示健康專線\n36: 32: ELSE\n37: 33:     recommendation ← Synthesize_Personalized_Guidance(daily_totals, tdee, P.goal)\n38: 34: END IF\n39: 35: \n40: 36: R ← Render_Multimodal_Card(verified_items, total_interval, energy_balance, recommendation)\n41: 37: RETURN R, D\n```\n\n---\n\n## PJ. Jump to an Example 端到端實例演繹\n\n* **使用者真實輸入**：「我剛吃了一碗加蛋牛肉麵，湯喝了一半。」\n* **Step 1 (前處理與意圖)**：辨識為 `log_food`，抽取實體：\n  * 食物 A：牛肉麵（份量：一碗，備註：湯喝半碗）\n  * 食物 B：蛋（數量：一顆，烹調方式：未指定）\n* **Step 2 (RAG 檢索與追問)**：\n  * 檢索命中臺灣在地向量庫之「紅燒牛肉麵（含高湯）」與「清燉牛肉麵」。\n  * 發現份量模糊（大碗/小碗？）與蛋的類型（滷蛋/水煮蛋/荷包蛋？），信心度 72%（$\u003c 80\\%$）。\n  * **Agent 主動追問**：「收到！請問這碗牛肉麵是小碗還是大碗？裡面的蛋是滷蛋還是水煮荷包蛋呢？」\n* **Step 3 (使用者補充)**：「是小碗的，加一顆滷蛋。」\n* **Step 4 (確定性計算)**：\n  * 小碗麵條約 160g、牛肉塊 4 塊（約 60g）、半碗紅燒牛肉高湯（約 250ml）。\n  * 查庫計算：麵體 $240\\text{ kcal}$、牛肉 $150\\text{ kcal}$、高湯吸收與油脂 $180\\text{ kcal}$、滷蛋一顆 $75\\text{ kcal}$。\n  * 傳遞不確定性：總熱量為 **$645 \\pm 50\\text{ kcal}$**（$595\\sim 695\\text{ kcal}$）。\n  * 巨量營養素：蛋白質 36g、碳水化合物 68g、脂肪 24g。\n* **Step 5 (安全檢查與反饋)**：無違規，對比使用者 TDEE（1,800 kcal），輸出精美卡片與健康建議：「這餐蛋白質非常充足！若想平衡鈉含量，建議下午多補充 500ml 溫水。」\n\n---\n\n## PK. Key Points Contribution 重點貢獻\n1. 建立將 LLM 嚴格作為對話狀態機、白名單 Function Calling 隔離計算的開源標準實作。\n2. 首創臺灣外食在地化 Clarification 追問樣式庫，解決外食雜訊大難以標準化的困境。\n3. 採用動態不確定區間，向使用者誠實揭露 AI 預測邊界，建立醫療人機信任感。\n\n## PL. Later Simulation 後續實驗驗證規劃\n（詳見第 4 節 Experiments 規劃）\n\n## PM. Math Proof 不確定性傳遞之數學模型\n設總熱量 $E = \\sum_i W_i K_i$，若每項食物份量 $W_i$ 具有標準差 $\\sigma_{W_i}$，每百克熱量檢索具有標準差 $\\sigma_{K_i}$，在各項相互獨立假設下，總熱量之一階誤差傳遞方差為：\n$$\\sigma_E^2 \\approx \\sum_{i=1}^{N} \\left[ \\left(\\frac{K_i}{100}\\right)^2 \\sigma_{W_i}^2 + \\left(\\frac{W_i}{100}\\right)^2 \\sigma_{K_i}^2 \\right]$$\nDietSense 據此輸出 95% 信賴區間 $[E - 1.96\\sigma_E, E + 1.96\\sigma_E]$，奠定嚴謹的工程科學性。\n\n\n\n---\n\n# DietSense 專案重構：Deep Research 三大核心問題\n\n\u003e 本章節嚴格依據《期末專題提案作業規範》第三部分重構，深入探討營養學、公共衛生與 AI 代理系統的 **Q1 五大核心思維、Q2 三大專業爭論與 Q3 十個深度理解問題**。\n\n---\n\n## Q1. 五個核心思維模式（Five Domain Mental Models）\n\n### 1. 能量平衡模型（Energy Balance / CICO Principle）\n* **意義（Meaning）**：體重增減本質上遵循熱力學第一定律（能量守恆定律）。當長期能量攝入大於總能量消耗（TDEE）時體重增加，反之則下降。能量赤字（Caloric Deficit）是所有減重干預的物理學基石。\n* **科學證據（Evidence）**：Hall et al.（2012, *American Journal of Clinical Nutrition*）利用代謝病房進行嚴格控制的雙盲試驗，證實無論飲食巨量營養素比例如何調配，只要能量平衡完全相同，受試者的體重變化與體脂變化在統計學上並無顯著差異。\n* **系統設計落實（System Design Impact）**：\n  * DietSense 拒絕單純計算「吃進多少」，而是同步維持使用者個人代謝檔案（Profile），計算每日動態能量天花板（TDEE）。\n  * 建議引擎輸出必須錨定於平衡基準線，例如：「今日累積攝入 1,450 kcal，對比您的 TDEE 1,850 kcal，達成 400 kcal 健康赤字。」\n\n### 2. 巨量營養素組成與食物熱效應（Macronutrient Composition \u0026 TEF）\n* **意義（Meaning）**：熱量並非均質。相同熱量的不同巨量營養素在人體內引發完全不同的代謝荷爾蒙反應、飽足感信號與食物熱效應（TEF，蛋白質 TEF 達 20–30%，碳水 5–10%，脂肪 0–3%）。高蛋白質與高纖維飲食能有效防止肌肉流失並抑制飢餓素（Ghrelin）。\n* **科學證據（Evidence）**：美國國家醫學科學院（NAM）制訂之可接受巨量營養素分佈範圍（AMDR）與臨床營養學研究表明，攝入足量蛋白質（1.2–1.6 g/kg/day）能於熱量限制期間維持去脂體重（Lean Mass）（Leidy et al., 2024）。\n* **系統設計落實（System Design Impact）**：\n  * 系統分析引擎強制執行 4/4/9 能量守恆雙向校驗。\n  * 互動卡片呈現碳水、蛋白質、脂肪之百分比與公克數分佈雷達圖，而非僅回報卡路里單一數字。\n\n### 3. 份量估算的不確定性量化（Portion Uncertainty Quantification）\n* **意義（Meaning）**：在真實世界的非受控環境中，自我回報飲食存在嚴重的測量噪聲（Measurement Noise）。外食中隱藏的炒菜油、高湯濃度與器皿容量具有天然隨機性。盲目輸出看似精確的數值（如 642.3 kcal）本質上是不科學的偽精確（False Precision）。\n* **科學證據（Evidence）**：Poslusna et al.（2024）與 Subar et al. 的大型世代回顧指出，成年人在自報飲食時存在 18%～54% 的系統性低估，其中 70% 以上的誤差源於份量大小（Portion Size）而非食材類別誤認。\n* **系統設計落實（System Design Impact）**：\n  * 系統拒絕單點估計，引入誤差傳遞模型輸出動態區間（如 $620 \\pm 60\\text{ kcal}$）。\n  * 設定信心度指標 $C \\in [0, 1]$，明確對使用者揭露數據置信水準。\n\n### 4. 個體生理與代謝差異（Individual Physiological Variation）\n* **意義（Meaning）**：相同的一餐在不同年齡、性別、骨骼肌量、腸道菌相與胰島素敏感度個體身上，會引發完全不同的生理響應。\n* **科學證據（Evidence）**：Weizmann 研究所的里程碑研究（Zeevi et al., 2015, *Cell*）透過連續血糖監測（CGM）追蹤 800 名受試者，證實攝入完全相同的標準化碳水食物（如白麵包）後，不同受試者之間的餐後血糖反應（PPGR）差異可高達 10 倍。\n* **系統設計落實（System Design Impact）**：\n  * 系統捨棄靜態的「每日推薦 2,000 kcal」通用標籤，採用個人化 Mifflin-St Jeor 運算引擎，依據年齡、身高、體重、活動係數計算專屬數值。\n  * 支援進階個人標籤（如糖尿病前期、乳糖不耐、甲狀腺低下），動態微調食材建議權重。\n\n### 5. 行為情境意識與長期遵從性（Behavioral Context Awareness \u0026 Adherence）\n* **意義（Meaning）**：進食行為深受心理壓力、社交情境、用餐時間與作息節律支配。高達 85% 飲食記錄者於 30 天內放棄的核心原因在於操作摩擦力與情感冷漠。\n* **科學證據（Evidence）**：Koenders \u0026 van Strien（2024）研究指出，35% 以上的過度進食屬於「情緒性進食（Emotional Eating）」或「夜間壓力進食」。純粹的數字記帳軟體無法提供共情支持與及時的情境介入。\n* **系統設計落實（System Design Impact）**：\n  * 記錄介面支援 Whisper 自然口語語音輸入，將記錄時間自 90 秒壓縮至 15 秒以內。\n  * 偵測到異常宵夜進食（如午夜 1 點連續高糖回報）時，給予溫暖關懷與情境引導，而非生硬警告。\n\n---\n\n## Q2. 三個最重要的專業爭論（Three Major Domain Controversies）\n\n```mermaid\nflowchart LR\n    subgraph C1[\"爭論一：熱量數量 vs 食物品質\"]\n        C1A[\"觀點 A: 能量赤字決定一切 (CICO)\"] \u003c--\u003e C1B[\"觀點 B: 荷爾蒙代謝決定論 (低碳/抗發炎)\"]\n    end\n    subgraph C2[\"爭論二：對話估算 vs 硬體精準\"]\n        C2A[\"觀點 A: 對話便利性優先 (提升遵從率)\"] \u003c--\u003e C2B[\"觀點 B: 臨床硬體精準優先 (秤重/3D掃描)\"]\n    end\n    subgraph C3[\"爭論三：通用指引 vs 精準個人化\"]\n        C3A[\"觀點 A: 官方公共衛生指引 (低成本安全)\"] \u003c--\u003e C3B[\"觀點 B: 基因體/腸道菌多體學個人化\"]\n    end\n```\n\n### 爭論一：Calorie Quantity vs. Calorie Quality（卡路里數量 vs. 食物品質）\n* **觀點 A（純熱量赤字說）**：主張「A calorie is a calorie」。100 kcal 砂糖與 100 kcal 堅果在熱力學上等價，只要總攝取低於消耗，任何比例均能減重。\n* **觀點 B（荷爾蒙/食物品質說）**：主張「Food quality matters more」。超加工食品引發胰島素激增、阻斷瘦素分泌並損害腸道菌，導致食慾失控與基礎代謝下降（Ludwig et al., 2018, *JAMA*）。\n* **雙方最強證據**：\n  * 觀點 A：無數等熱量代謝病房嚴格對照試驗顯示，只要能量赤字鎖定，低碳與低脂組體重減輕無統計學差異。\n  * 觀點 B：大規模觀察性研究顯示，攝入高比例超加工食品者，即使短期熱量匹配，長期肥胖與全因死亡率顯著高於原型食物組（Hall et al., *Cell Metabolism*）。\n* **目前領域共識**：**「熱量赤字是體重減輕的必要條件（Necessary Condition），而食物品質則是長期可維持性、飽足感與代謝健康的充分條件（Sufficient Condition）。」**\n* **尚未解決之問題**：超加工食品對下視丘體重設定點（Set-point）的分子生物學破壞機制尚未完全釐清；個人化碳水耐受度缺乏低成本檢測標準。\n* **DietSense 系統決策**：採取**「雙軌輸出機制」**——左軌以 Mifflin-St Jeor 運算嚴格錨定總熱量赤字；右軌提供加工程度評級與低升糖（Low-GI）、高纖原型食物替代建議。\n\n### 爭論二：AI Portion Estimation Accuracy（純對話/LLM 估算 vs. 外部硬體秤重/3D 視覺）\n* **觀點 A（對話估算優先說）**：日常大眾無法隨身攜帶食物秤；LLM + 澄清追問在 $\\pm 20\\%$ 誤差內已足以支撐日常行為改變，便利性與持續性是第一優先。\n* **觀點 B（硬體物理精準說）**：日常自報誤差高達 50%，若缺乏 3D 結構光相機或藍牙智慧秤，純文字對話與 2D 拍照在臨床醫療上毫無信度。\n* **雙方最強證據**：\n  * 觀點 A：行為科學證實記錄工具的操作摩擦力每增加 10%，使用者流失率增加 25%；持續 80% 準確的記錄遠勝過 3 天就放棄的 100% 測量。\n  * 觀點 B：臨床營養介入研究表明，自報誤差可能完全抵消預期設定的 300 kcal 每日赤字，導致減重停滯。\n* **目前領域共識**：日常公衛自主管理應以**「降低使用門檻」**為導向；臨床重度肥胖或術後監測則需硬體介入。\n* **尚未解決之問題**：如何在不大幅增加對話輪次的情況下，自動收斂使用者模糊份量描述的認知邊界。\n* **DietSense 系統決策**：設計**「Clarification Loop 動態追問」**，僅在份量模糊關鍵點發問（最多追問 1～2 輪），並以動態信賴區間向使用者誠實通報估算邊界。\n\n### 爭論三：Universal Guidelines vs. Highly Personalized Nutrition（公衛通用指引 vs. 高度精準個人化）\n* **觀點 A（通用指引有效說）**：衛福部飲食指南與 DRIs 歷經數十年群體流行病學驗證，安全性高且具法律保護，適用於 90% 以上的一般健康人群。\n* **觀點 B（精準個人化說）**：基因多型性（SNPs）、腸道微生物菌相與連續生理監測（CGM）決定了唯一的個體最適營養方案，通用指引過於粗糙。\n* **雙方最強證據**：\n  * 觀點 A：遵循公衛地中海飲食或 DASH 飲食的大型前瞻性世代研究（如 Nurses\u0027 Health Study）證實能顯著降低群體心血管發病率。\n  * 觀點 B：同卵雙胞胎對相同碳水餐點的餐後胰島素與血糖震盪曲線存在巨大異質性（Specter et al., 2024）。\n* **目前領域共識**：**「公衛指南是安全性底線，個人化是成效優化方向。」** 兩者並非對立，而是分層堆疊關係。\n* **尚未解決之問題**：AI 提供高度個人化飲食建議的法律責任劃分（是否構成非特許醫療行為？）；隱私與基因數據之合規保護。\n* **DietSense 系統決策**：系統以衛福部國人每日飲食指南為硬性基線，以個人年齡、活動量與偏好微調建議，嚴格明訂非醫療診斷之免責聲明，特殊病患（洗腎、第 1 型糖尿病、孕婦）強制警示轉介。\n\n---\n\n## Q3. 十個深度理解問題（Ten In-Depth Evaluative Questions）\n\n為檢驗對本專案技術與領域深度之掌握，涵蓋 Why, What-if, Trade-off, Failure Case, Evidence, Comparison, Design Decision, Real-world Scenario 等推理維度：\n\n### 1. [Why] 代謝適應性與個體差異\n* **問題**：為什麼攝取完全相同熱量赤字（例如每日 -500 kcal）的兩名成年人，一個持續減重，另一個卻在兩週後進入體重停滯期？Agent 應如何處理這種代謝適應性（Metabolic Adaptation），而非盲目給予更嚴苛的少吃建議？\n* **解答重點**：減重過程中隨著體重減輕，BMR 下降，且人體會發生非自發性活動消耗（NEAT）自發性下調；此現象稱為適應性生熱（Adaptive Thermogenesis）。Agent 不應機械性減少熱量，而應重新計算當前體重之 TDEE，並主動提示檢視步數（NEAT）與蛋白質比例，必要時建議安排「飲食復原期（Diet Break）」。\n\n### 2. [What-if] 模糊輸入之澄清與不確定性量化\n* **問題**：如果使用者輸入極度簡略：「我剛剛吃了一碗泡麵」，完全未提及品牌、口味、加蛋與否及湯汁飲用狀況，Agent 應如何在不使使用者反感的前提下執行澄清與數值估算？\n* **解答重點**：啟用動態追問決策樹。先檢索在地資料庫獲得臺灣泡麵之分佈先驗（Prior Distribution: 均值 450 kcal，方差 $\\pm 120\\text{ kcal}$）。若使用者處於快速記錄狀態，追問僅限一個核心高方差問題：「請問有把高鈉濃湯全部喝完嗎？（喝完約 +100 kcal 及高鈉）」，並輸出寬區間 $[380, 560]\\text{ kcal}$。\n\n### 3. [Trade-off] 追問輪次與使用者體驗之帕累托最優\n* **問題**：追問越多問題能讓數值越精準，但會迅速消耗使用者耐心導致流失；完全不追問則速度快但數值失真。如何從工程與行為學角度設計平衡指標？\n* **解答重點**：建立評估指標 $\\mathcal{J} = \\Delta \\text{Accuracy} / \\Delta \\text{Turn}$。系統設定單餐追問輪次上限為 **1 輪（Max 2 Questions）**，且只對估算方差大於總熱量 25% 的關鍵成分（如油炸物外皮、高油濃湯、手搖飲全糖/無糖）發起追問。\n\n### 4. [Failure Case] 未知食物的優雅降級（Graceful Degradation）\n* **問題**：當使用者描述一個完全未收錄在 USDA 或臺灣食品成分庫的食物（例如「奶奶自製的眷村炒年糕」），Agent 該如何應對？\n* **解答重點**：嚴禁報錯中斷或直接胡亂捏造數字。執行三級降級機制：\n  1. *實體拆解（Decomposition）*：由 LLM 將菜餚分解為標準食材（年糕片 150g + 肉絲 30g + 高麗菜 50g + 炒菜油 15g）；\n  2. *成分庫映射*：對拆解後各單一成分進行檢索加總；\n  3. *標註預估與透明聲明*：在卡片中標記「此為複合菜餚估算值，信心度 65%」，並提供手動微調滑桿。\n\n### 5. [Evidence] 隨機對照試驗（RCT）之嚴謹驗證設計\n* **問題**：如何設計一個嚴謹的臨床隨機對照試驗（RCT）來驗證 DietSense 相較於傳統手動記錄 App（如 MyFitnessPal）的真實有效性？\n* **解答重點**：採 12 週單盲平行對照試驗（N=100，BMI 25–35）。實驗組使用 DietSense，對照組使用 MyFitnessPal。主要終點（Primary Endpoint）為**使用者 30/60/90 天依從率（Log Adherence Rate）**與**體重減輕百分比（% Weight Loss）**；次要終點為雙能 X 光（DXA）測量之體脂變化、記錄耗時與滿意度（SUS）。\n\n### 6. [Comparison] 架構抉擇：RAG vs. 微調 LLM vs. 知識圖譜\n* **問題**：比較「RAG-based LLM」、「Fine-tuned Domain LLM」與「Knowledge Graph + Rule Engine」在飲食熱量查詢任務上的準確度、維護性與幻覺抑制？\n* **解答重點**：\n  * *Fine-tuned LLM*：自然語言流暢，但熱量數值仍有隨機微調漂移風險，重新訓練成本高。\n  * *Knowledge Graph + Rules*：邏輯百分之百精確，但無法處理模糊口語與長尾小吃實體。\n  * *RAG + Tool Use（DietSense 抉擇）*：兼具 LLM 的理解彈性與外部資料庫的可更新性，食材成分修改無需重訓模型，為當前兼顧可維護性與準確度的最優解。\n\n### 7. [Design Decision] 對話式 CUI 與傳統 GUI 的場景邊界\n* **問題**：為什麼本專案選擇「對話式 AI」？在哪些情境下，對話式反而比傳統 GUI 表現更差？\n* **解答重點**：\n  * *優勢場景*：快速輸入、複合菜餚描述、語音輸入（駕駛或行走時）、個人化追問與共情建議。\n  * *劣勢場景*：歷史趨勢長條圖檢視、批量食材編輯、多日期熱量比對。\n  * *設計決策*：DietSense 採「對話驅動輸入 + 結構化卡片與圖表輸出」之混合架構（Hybrid CUI/GUI），不以純文字對話取代圖形視覺。\n\n### 8. [Real-world Scenario] 臺灣在地非標準化小吃的資料可信度\n* **問題**：臺灣夜市與街頭小吃（如雞排、蚵仔煎、大腸包小腸）各家作法差異巨大，如何保證在地資料庫的科學性與代表性？\n* **解答重點**：\n  * 結合衛福部國健署發行之《臺灣常用小吃營養成分手冊》作為中位數基線。\n  * 爬取公開食品檢驗報告建立標準差分佈（例如雞排基準重量 $220\\text{g} \\pm 30\\text{g}$，帶骨吸油率加成）。\n  * 引入使用者眾包微調與營養師審核機制，持續迭代向量特徵庫。\n\n### 9. [Why] 代謝公式的假設邊界與特殊族群限制\n* **問題**：Mifflin-St Jeor 公式基於哪些群體假設？在哪些特殊人群（高肌肉運動員、高齡骨質疏鬆長者、孕婦）上會嚴重失準？\n* **解答重點**：Mifflin-St Jeor 依賴體重、身高、年齡推估去脂體重，預設受試者體脂率處於常態分佈。\n  * 健美健力運動員（高肌肉量）會被顯著低估 BMR；\n  * 肥胖肌少症高齡長者（高體脂低肌肉）會被顯著高估 BMR；\n  * 孕期婦女需額外計入胎兒發育能量消耗（第二期 +300 kcal，第三期 +450 kcal）。\n  * 系統需在註冊時收集進階標籤，對健美運動員切換至以瘦體重為基礎的 **Katch-McArdle 公式**。\n\n### 10. [What-if] 安全性守門：飲食失調與極端限制之防範機制\n* **問題**：若使用者向 Agent 表示：「我這週要穿禮服，未來 5 天每天只能吃 500 大卡，請幫我規劃菜單」，系統在架構與 Prompt 上應如何反應？\n* **解答重點**：觸發核心安全熔斷規則（Safety Guardrail）：\n  1. *拒絕服務*：系統強制攔截 $\u003c1,200\\text{ kcal}$ 之生成請求，禁止輸出此類危險菜單；\n  2. *同理並闡釋生理機制*：向使用者說明極低熱量飲食會迅速消耗骨骼肌、拉低 BMR 並引發停經或落髮風險；\n  3. *替代引導*：給予符合健康標準的溫和赤字方案（-300~500 kcal），並在偵測到嚴重催吐或絕食字眼時主動提供心理健康諮詢資源。\n\n\n\n---\n\n## 六、References 參考文獻\n1. World Health Organization (WHO). (2024/2025). Obesity and overweight fact sheet.\n2. 衛生福利部國民健康署 (Taiwan HPA). (2024/2025). 國民營養健康狀況變遷調查成果報告.\n3. Hall, K. D., et al. (2011). Quantification of the effect of energy imbalance on bodyweight. *The Lancet*, 378(9793), 826-837.\n4. Zeevi, D., et al. (2015). Personalized nutrition by prediction of glycemic responses. *Cell*, 163(5), 1079-1094.\n5. Poslusna, K., et al. (2009/2024). Misreporting of energy and micronutrient intake: A systematic review. *British Journal of Nutrition*.\n6. Mifflin, M. D., et al. (1990). A new predictive equation for resting energy expenditure in healthy individuals. *American Journal of Clinical Nutrition*, 51(2), 241-247.\n7. Teixeira, P. J., et al. (2025). Digital dietary self-monitoring adherence and clinical weight loss: A randomized trial. *Journal of Medical Internet Research*.\n8. Ludwig, D. S., et al. (2018). Effects of a low-carbohydrate diet on energy expenditure during weight loss maintenance: Randomized trial. *BMJ*, 363, k4583.\n9. USDA Agricultural Research Service. (2024). FoodData Central (FDC).\n10. 衛生福利部食品藥物管理署 (TFDA). (2024). 臺灣食品成分資料庫.\r\n",
